<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบไฟล์ผลตรวจปอด</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="updateBar" class="update-bar" hidden></div>
  <main>
    <header>
      <h1>ตรวจสอบไฟล์ผลตรวจปอด</h1>
      <p class="sub">ตรวจว่าไฟล์จากเครื่อง Spirometry สมบูรณ์หรือไม่ก่อนนำไปใช้ต่อ — ตรวจในเครื่องนี้เท่านั้น ไม่ส่งข้อมูลออกอินเทอร์เน็ต และไม่แก้ไขไฟล์</p>
    </header>

    <section id="drop" class="drop" tabindex="0" role="button" aria-label="ลากไฟล์มาวางหรือกดเพื่อเลือกไฟล์">
      <div class="drop-title">ลากไฟล์มาวางที่นี่ หรือกดเพื่อเลือกไฟล์</div>
      <div class="drop-hint">.xls, .xlsx, .csv — สูงสุด 20 ไฟล์ ไฟล์ละไม่เกิน 10MB</div>
      <input id="picker" type="file" multiple accept=".xls,.xlsx,.csv" hidden>
    </section>

    <section id="picked" hidden>
      <ul id="fileList" class="file-list"></ul>
      <div id="pickNote" class="note" hidden></div>
      <div class="actions">
        <button id="checkBtn" class="btn primary">ตรวจสอบ</button>
        <button id="clearBtn" class="btn">ล้างไฟล์</button>
      </div>
    </section>

    <section id="results" hidden>
      <div class="results-head">
        <h2>ผลการตรวจ</h2>
        <button id="exportBtn" class="btn">ส่งออกผลเป็น CSV/Excel</button>
      </div>
      <div id="summary" class="summary"></div>
      <div id="cards"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
