<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบไฟล์ผลตรวจปอด</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="updateBar" class="update-bar" hidden></div>

  <header class="topbar">
    <div class="topbar-in">
      <span class="app-name">ตรวจสอบไฟล์ผลตรวจปอด</span>
      <span class="app-note">Spirometry · ตรวจในเครื่องนี้เท่านั้น ไม่แก้ไขไฟล์ ไม่ส่งข้อมูลออกอินเทอร์เน็ต</span>
    </div>
  </header>

  <main>
    <section id="drop" class="drop" tabindex="0" role="button" aria-label="เลือกไฟล์ผลตรวจ">
      <div class="drop-main">ลากไฟล์ผลตรวจมาวางที่นี่ หรือ <u>เลือกจากเครื่อง</u></div>
      <div class="drop-hint">.xls .xlsx .csv · ไม่เกิน 20 ไฟล์ · ไฟล์ละไม่เกิน 10 MB</div>
      <input id="picker" type="file" multiple accept=".xls,.xlsx,.csv" hidden>
    </section>

    <section id="picked" class="picked" hidden>
      <ul id="fileList" class="file-list"></ul>
      <p id="pickNote" class="note" hidden></p>
      <div class="actions">
        <button id="checkBtn" class="btn primary">ตรวจสอบ</button>
        <button id="clearBtn" class="btn">ล้างไฟล์</button>
      </div>
    </section>

    <section id="results" class="results" hidden>
      <div class="results-head">
        <p id="summary" class="summary"></p>
        <button id="exportBtn" class="btn">ส่งออกผลเป็น CSV/Excel</button>
      </div>
      <div id="cards"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
