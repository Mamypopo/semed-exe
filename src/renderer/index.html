<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEMed Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="updateBar" class="update-bar" hidden></div>

  <header class="topbar">
    <div class="topbar-in">
      <span class="app-name">SEMed Tools</span>
      <span id="appVersion" class="app-version"></span>
      <button id="updateCheck" class="linkbtn" type="button">ตรวจสอบอัปเดต</button>
    </div>
  </header>

  <nav class="tabs" aria-label="เมนู">
    <div class="tabs-in">
      <button class="tab active" type="button" data-page="check"><span data-icon="file-check"></span>ตรวจไฟล์ผลตรวจปอด</button>
      <button class="tab" type="button" data-page="tools"><span data-icon="layout-grid"></span>โปรแกรมอื่น</button>
    </div>
  </nav>

  <main id="page-check">
    <p class="page-note">Spirometry · ตรวจในเครื่องนี้เท่านั้น ไม่แก้ไขไฟล์ ไม่ส่งข้อมูลออกอินเทอร์เน็ต</p>
    <section id="drop" class="drop" tabindex="0" role="button" aria-label="เลือกไฟล์ผลตรวจ">
      <div class="drop-main">ลากไฟล์ผลตรวจมาวางที่นี่ หรือ <u>เลือกจากเครื่อง</u></div>
      <div class="drop-hint">.xls .xlsx .csv · ไม่เกิน 20 ไฟล์ · ไฟล์ละไม่เกิน 10 MB</div>
      <input id="picker" type="file" multiple accept=".xls,.xlsx,.csv" hidden>
    </section>

    <section id="picked" class="picked" hidden>
      <ul id="fileList" class="file-list"></ul>
      <p id="pickNote" class="note" hidden></p>
      <div class="actions">
        <button id="checkBtn" class="btn primary">ตรวจสอบ</button>
        <button id="clearBtn" class="btn">ล้างไฟล์</button>
      </div>
    </section>

    <section id="results" class="results" hidden>
      <div class="results-head">
        <p id="summary" class="summary"></p>
        <button id="exportBtn" class="btn"><span data-icon="download"></span>ส่งออกผลเป็น CSV/Excel</button>
      </div>
      <div id="cards"></div>
    </section>
  </main>

  <main id="page-tools" hidden>
    <div class="tools-head">
      <p class="page-note">โปรแกรมและเว็บที่ใช้ร่วมกัน ดาวน์โหลดจาก GitHub ของ SEMed</p>
      <button id="toolsRefresh" class="linkbtn" type="button"><span data-icon="refresh-cw"></span>โหลดรายการใหม่</button>
    </div>
    <div id="toolList" class="tool-list"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="tools.js"></script>
</body>
</html>
